# The codec presents L/R reversed
pcm.!default {
	type plug
	slave.pcm "hw:wm8505ac97,0"
	ttable.0.1 1
	ttable.1.0 1
}

# Apps drive "PCM"; gang it across both analog taps
ctl.!default {
	type remap
	child "hw:wm8505ac97"
	remap {
		"name='PCM Playback Volume'" "name='Digital Playback Volume'"
		"name='PCM Playback Switch'" "name='Digital Playback Switch'"
	}
	map {
		"name='PCM Playback Volume'" {
			"name='Headphone Playback Volume'" {
				vindex.0 0
				vindex.1 1
			}
			"name='Master Playback Volume'" {
				vindex.0 0
				vindex.1 1
			}
		}
		"name='PCM Playback Switch'" {
			"name='Headphone Playback Switch'" {
				vindex.0 0
			}
			"name='Master Playback Switch'" {
				vindex.0 0
			}
		}
	}
}
