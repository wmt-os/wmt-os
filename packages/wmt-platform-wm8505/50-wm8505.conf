defaults.pcm.ipc_perm 0666

cards.wm8505-ac97.pcm.default {
	@args [ CARD ]
	@args.CARD { type string }
	type asym
	playback.pcm {
		type plug
		# Upmix before the swap so mono reaches both channels
		slave.pcm {
			type route
			slave.pcm "dmix:wm8505ac97,0"
			# The codec presents L/R reversed
			ttable.0.1 1
			ttable.1.0 1
		}
	}
	capture.pcm {
		type plug
		slave.pcm "hw:wm8505ac97,0"
		# Same swap, so mono recordings keep the mic
		ttable.0.1 1
		ttable.1.0 1
	}
}

# Stock card files include front, and this card has none
cards {
	<confdir:pcm/front.conf>
}

cards.wm8505-ac97.pcm.front.0 {
	@args [ CARD ]
	@args.CARD { type string }
	type plug
	slave.pcm {
		type route
		slave.pcm "hw:wm8505ac97,0"
		ttable.0.1 1
		ttable.1.0 1
	}
}

cards.wm8505-ac97.ctl.default {
	@args [ CARD ]
	@args.CARD { type string }
	type remap
	child "hw:wm8505ac97"
	remap {
		"name='PCM Playback Volume'" "name='Digital Playback Volume'"
		"name='PCM Playback Switch'" "name='Digital Playback Switch'"
	}
	# Apps drive "PCM"; gang it across both analog taps
	map {
		"name='PCM Playback Volume'" {
			"name='Headphone Playback Volume'" {
				vindex.0 0
				vindex.1 1
			}
			"name='Master Playback Volume'" {
				vindex.0 0
				vindex.1 1
			}
		}
		"name='PCM Playback Switch'" {
			"name='Headphone Playback Switch'" {
				vindex.0 0
			}
			"name='Master Playback Switch'" {
				vindex.0 0
			}
		}
	}
}
